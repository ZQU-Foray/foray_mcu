# 复制自组织 CI 模板：ZQU-Foray/.github → workflows/ci-template.yml
#
# 本仓的调整（来由见 decision.md 中与 CI 有关的决策）：
#   - lint-c 改为由 tool/ci/format.py 全量检查：范围是手写 C/C++，排除 CubeMX 生成区、
#     厂商代码与 vendor 生成头（P0.5 一次性格式化之后）。
#   - 新增 lint-naming：tool/ci/naming.py 全量检查 C++ 命名（clang-tidy，P0.5 改名之后）；
#     P1 起编译数据库来自根工程的三个 preset。
#   - 新增 lint-arch：tool/ci/arch_check.py 的文本扫描（依赖规则 3、8、9、12、15，P1 起；F1 加入 13、17）。
#   - 新增 host-tests：根工程 host-tests preset 的宿主测试（ctest）与宿主依赖图检查。
#   - 新增 framework（F1）：在只含框架文件的副本里做框架独立构建（宿主）
#     并检查依赖图；为 Cortex-M0+ 构建框架，检查没有原子读改写的库调用（规则 2、13、15）。
#   - 新增 firmware：根工程构建固件（arm-debug、arm-release），与迁移源的符号集合比较
#     （名称、大小、类型，P1–P2.5 的判据），并检查固件依赖图；
#     P2 起迁移源构建随搬迁失效，基准改为 P1 存档的符号表，迁移源基线 SHA 校验删除；
#     F2 起固件行为开始改变，符号对照退役，改为段大小报告，并加入 HAL 回调符号检查（规则 16）。
#   - 删除 build-ros2：本仓是 MCU 固件，不是 ROS 2 工作空间。
#
# 设计原则沿用模板：没有适用文件就跳过；存量不合规代码不让 CI 长期红灯，新代码不放过。

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # clang-format 统一用 18。
  CLANG_FORMAT_VERSION: "18.1.8"
  CLANG_TIDY_VERSION: "18.1.8"
  # 与基线复现所用工具链同版本（docs/ai/decisions/2026-10-25-迁移基线与对照.md §7）。
  XPACK_GCC_VERSION: "15.2.1-1.1"
  # 来源：xPack 发布页 xpack-arm-none-eabi-gcc-15.2.1-1.1-linux-x64.tar.gz.sha
  XPACK_GCC_SHA256: "da6a49ad4003944b823c6c93702a8787c922ab34bd7e918ec0eaf6933a9b1ff6"

jobs:
  # ---- Python 代码检查（模板原样） ----
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检测是否存在 Python 代码
        id: detect
        shell: bash
        run: |
          if find . -name '*.py' -not -path './.git/*' | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "未发现 Python 代码，跳过。"
          fi

      - name: Set up Python
        if: steps.detect.outputs.found == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        if: steps.detect.outputs.found == 'true'
        run: |
          pip install ruff black

      - name: Lint with ruff
        if: steps.detect.outputs.found == 'true'
        # 本仓调整：以 GitHub 注释格式输出，错误直接标在 PR 的文件行上
        run: |
          ruff --version
          ruff check --output-format=github .

      - name: Format check with black
        if: steps.detect.outputs.found == 'true'
        run: black --check --diff .

  # ---- C/C++ 格式检查（全量，本仓调整） ----
  # 手写代码已在 P0.5 一次性格式化。检查范围与排除项由
  # tool/ci/format.py 统一定义，本地用同一个脚本检查或格式化。
  lint-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 clang-format
        run: pip install "clang-format==${CLANG_FORMAT_VERSION}"

      - name: 格式检查（全量）
        shell: bash
        run: |
          if ! python tool/ci/format.py --check; then
            echo "::error::C/C++ 文件不符合 .clang-format。本地执行 python tool/ci/format.py --fix（clang-format ${CLANG_FORMAT_VERSION}）后重新提交。"
            exit 1
          fi

  # ---- C++ 命名检查（全量，本仓新增） ----
  # 规则见根目录 .clang-tidy（ROS 2 命名），由 tool/ci/naming.py 执行。
  # 被 #if 关掉的代码对 clang-tidy 不可见，所以三种配置都要检查：固件 Debug（打开 IMU 诊断代码）、
  # 固件 Release（#else 分支）与宿主测试；另加框架独立构建，覆盖只在其中编译的 test/framework。
  # 只做 cmake 配置生成编译数据库，不编译。
  lint-naming:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 clang-tidy
        run: pip install "clang-tidy==${CLANG_TIDY_VERSION}" "pyyaml==6.0.2"

      - name: 安装 Arm GNU 工具链
        uses: ./.github/actions/setup-arm-gcc

      - name: 生成编译数据库
        run: |
          cmake --preset arm-debug
          cmake --preset arm-release
          cmake --preset host-tests
          cmake --preset framework
          cmake --preset arm-debug -B build/arm-debug-link -DPROFILE=link_dm_mc02

      - name: 命名检查（全量）
        shell: bash
        run: |
          if ! python tool/ci/naming.py --check \
               -p build/arm-debug -p build/arm-release -p build/host-tests -p build/framework \
               -p build/arm-debug-link; then
            echo "::error::C++ 命名不符合 .clang-tidy。本地生成这五个编译数据库后执行 python tool/ci/naming.py --fix（clang-tidy ${CLANG_TIDY_VERSION}），模板与注释里的遗漏需手工补齐。"
            exit 1
          fi

  # ---- 架构文本扫描（本仓新增） ----
  # 依赖规则中靠文本检查的部分（docs/ai/architecture.md §4.2）；依赖图检查在 host-tests 与 firmware 作业中。
  lint-arch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 文本扫描（规则 3、8、9、12、13、15、17）
        run: python tool/ci/arch_check.py scan

  # ---- Python 测试（模板原样） ----
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检测是否存在 Python 测试
        id: detect
        shell: bash
        run: |
          if find . \( -name 'test_*.py' -o -name '*_test.py' \) \
               -not -path './.git/*' | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "未发现 Python 测试，跳过。"
          fi

      - name: Set up Python
        if: steps.detect.outputs.found == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        if: steps.detect.outputs.found == 'true'
        shell: bash
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest

      - name: Run tests
        if: steps.detect.outputs.found == 'true'
        run: pytest -v

  # ---- 宿主测试（本仓新增） ----
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Ninja
        shell: bash
        run: |
          command -v ninja >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q ninja-build; }
          g++ --version | head -1
          cmake --version | head -1

      - name: 配置
        run: cmake --preset host-tests --graphviz=build/host-tests/graph/targets.dot

      - name: 依赖图检查（宿主）
        run: python3 tool/ci/arch_check.py graph build/host-tests/graph/targets.dot --mode host

      - name: 构建
        run: cmake --build --preset host-tests

      - name: 测试
        run: ctest --preset host-tests

  # ---- 框架独立构建（本仓新增，F1） ----
  # 规则 2、15：框架（src + platform/mock + cmake）不引用产品。只取出框架文件（git archive），
  # 在没有 app/、config/、test/host 与任何板卡的副本里配置和构建：引用产品的路径会编译失败，
  # 链接产品的 target 会在依赖图里显示为外部库，由 arch_check.py graph --mode framework 拦下。
  # 规则 13：Cortex-M0+ 没有 LDREX/STREX，原子读改写只能编译成库调用；为 M0+ 构建框架后检查静态库
  # 里没有 __atomic_*、__sync_* 调用（例外 X-17 的 target 暂不编译，F3 解除）。
  framework:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Arm GNU 工具链
        uses: ./.github/actions/setup-arm-gcc

      - name: 取出框架文件
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/framework"
          git archive HEAD CMakeLists.txt CMakePresets.json cmake src platform/mock test/framework \
            | tar -x -C "$RUNNER_TEMP/framework"
          ls "$RUNNER_TEMP/framework"

      - name: 宿主：配置、依赖图检查、构建
        shell: bash
        working-directory: ${{ runner.temp }}/framework
        run: |
          cmake --preset framework --graphviz=build/framework/graph/targets.dot
          python3 "$GITHUB_WORKSPACE/tool/ci/arch_check.py" graph build/framework/graph/targets.dot --mode framework
          cmake --build --preset framework

      - name: Cortex-M0+：构建并检查原子库调用
        shell: bash
        working-directory: ${{ runner.temp }}/framework
        run: |
          cmake --preset framework-m0plus
          cmake --build --preset framework-m0plus
          python3 "$GITHUB_WORKSPACE/tool/ci/arch_check.py" atomics build/framework-m0plus \
            --nm "$ARM_GCC_ROOT/bin/arm-none-eabi-nm"

  # ---- 固件构建、段大小报告与依赖图检查（本仓新增） ----
  # P1–P2.5 用符号集合与迁移源对照；F2 起固件行为开始改变，对照退役，
  # 改为在作业摘要里给出段大小报告（各存储区用量与各段大小，与链接器的 --print-memory-usage 一致）。
  # 纯移动、纯改名的提交仍可在本地用 tool/ci/symbols.py compare 自证符号不变。
  # 规则 16：port 定义的每个 HAL_*Callback 在固件里都是强符号，没有被 C++ 改名的回调。
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Arm GNU 工具链
        uses: ./.github/actions/setup-arm-gcc

      - name: 构建固件（arm-debug 与 arm-release）
        shell: bash
        run: |
          cmake --preset arm-debug --graphviz=build/arm-debug/graph/targets.dot
          cmake --build --preset arm-debug
          cmake --preset arm-release
          cmake --build --preset arm-release

      # 上位机链路联调的 profile：preset 默认是 bringup，用 -DPROFILE 换 profile
      - name: 构建固件（link_dm_mc02）
        shell: bash
        run: |
          cmake --preset arm-debug -B build/arm-debug-link -DPROFILE=link_dm_mc02 \
            --graphviz=build/arm-debug-link/graph/targets.dot
          cmake --build build/arm-debug-link
          cmake --preset arm-release -B build/arm-release-link -DPROFILE=link_dm_mc02
          cmake --build build/arm-release-link

      - name: 依赖图检查（固件）
        shell: bash
        run: |
          python3 tool/ci/arch_check.py graph build/arm-debug/graph/targets.dot --mode firmware
          python3 tool/ci/arch_check.py graph build/arm-debug-link/graph/targets.dot --mode firmware

      - name: HAL 回调符号检查（规则 16）
        shell: bash
        run: |
          nm="$ARM_GCC_ROOT/bin/arm-none-eabi-nm"
          for dir in build/arm-*; do
            for elf in "$dir"/firmware_*.elf; do
              python3 tool/ci/arch_check.py callbacks "$elf" --nm "$nm" --port platform/st/dm_mc02/port
            done
          done

      - name: 段大小报告
        shell: bash
        run: |
          readelf="$ARM_GCC_ROOT/bin/arm-none-eabi-readelf"
          for dir in build/arm-*; do
            for elf in "$dir"/firmware_*.elf; do
              name="$(basename "$elf" .elf)"
              python3 tool/ci/symbols.py --readelf "$readelf" report \
                --map "${elf%.elf}.map" --title "$name（$(basename "$dir")）" "$elf" \
                | tee -a "$GITHUB_STEP_SUMMARY"
              sha256sum "${elf%.elf}.bin" | tee -a "$GITHUB_STEP_SUMMARY"
              echo | tee -a "$GITHUB_STEP_SUMMARY"
            done
          done

      - name: 上传构建产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/arm-*/firmware_*.elf
            build/arm-*/firmware_*.bin
            build/arm-*/firmware_*.hex
            build/arm-*/firmware_*.map
          if-no-files-found: ignore
          retention-days: 14
