# 复制自组织 CI 模板：ZQU-Foray/.github → workflows/ci-template.yml
#
# 本仓的调整（见 decision.md Decision-20261026-01 及之后的 CI 相关决策）：
#   - lint-c 改为由 tool/ci/format.py 全量检查：范围是手写 C/C++，排除 CubeMX 生成区、
#     厂商代码与 vendor 生成头（P0.5 一次性格式化之后，Decision-20261026-04）。
#   - 新增 lint-naming：tool/ci/naming.py 全量检查 C++ 命名（clang-tidy，P0.5 改名之后，
#     Decision-20261026-05）；P1 起编译数据库来自根工程的三个 preset。
#   - 新增 lint-arch：tool/ci/arch_check.py 的文本扫描（依赖规则 3、8、9、12、15，P1 起）。
#   - 新增 host-tests：根工程 host-tests preset 的宿主测试（ctest）与宿主依赖图检查。
#   - 新增 firmware：根工程构建固件（arm-debug、arm-release），与迁移源构建逐个比较符号集合
#     （名称、大小、类型，P1–P2.5 的判据），并检查固件依赖图（Decision-20261026-07）；
#     迁移源仍单独构建，Release 镜像必须与基线 SHA-256 逐字节一致（P0–P1 有效，P2 搬迁后删除）。
#   - 删除 build-ros2：本仓是 MCU 固件，不是 ROS 2 工作空间。
#
# 设计原则沿用模板：没有适用文件就跳过；存量不合规代码不让 CI 长期红灯，新代码不放过。

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与 Decision-20261025-04 一致：clang-format 统一用 18。
  CLANG_FORMAT_VERSION: "18.1.8"
  CLANG_TIDY_VERSION: "18.1.8"
  # 与基线复现所用工具链同版本（docs/ai/decisions/2026-10-25-迁移基线与对照.md §7）。
  XPACK_GCC_VERSION: "15.2.1-1.1"
  # 来源：xPack 发布页 xpack-arm-none-eabi-gcc-15.2.1-1.1-linux-x64.tar.gz.sha
  XPACK_GCC_SHA256: "da6a49ad4003944b823c6c93702a8787c922ab34bd7e918ec0eaf6933a9b1ff6"

jobs:
  # ---- Python 代码检查（模板原样） ----
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检测是否存在 Python 代码
        id: detect
        shell: bash
        run: |
          if find . -name '*.py' -not -path './.git/*' | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "未发现 Python 代码，跳过。"
          fi

      - name: Set up Python
        if: steps.detect.outputs.found == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        if: steps.detect.outputs.found == 'true'
        run: |
          pip install ruff black

      - name: Lint with ruff
        if: steps.detect.outputs.found == 'true'
        # 本仓调整：以 GitHub 注释格式输出，错误直接标在 PR 的文件行上
        run: |
          ruff --version
          ruff check --output-format=github .

      - name: Format check with black
        if: steps.detect.outputs.found == 'true'
        run: black --check --diff .

  # ---- C/C++ 格式检查（全量，本仓调整） ----
  # 手写代码已在 P0.5 一次性格式化（Decision-20261026-04）。检查范围与排除项由
  # tool/ci/format.py 统一定义，本地用同一个脚本检查或格式化。
  lint-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 clang-format
        run: pip install "clang-format==${CLANG_FORMAT_VERSION}"

      - name: 格式检查（全量）
        shell: bash
        run: |
          if ! python tool/ci/format.py --check; then
            echo "::error::C/C++ 文件不符合 .clang-format。本地执行 python tool/ci/format.py --fix（clang-format ${CLANG_FORMAT_VERSION}）后重新提交。"
            exit 1
          fi

  # ---- C++ 命名检查（全量，本仓新增） ----
  # 规则见根目录 .clang-tidy（ROS 2 命名），由 tool/ci/naming.py 执行（Decision-20261026-05）。
  # 被 #if 关掉的代码对 clang-tidy 不可见，所以三种配置都要检查：固件 Debug（打开 IMU 诊断代码）、
  # 固件 Release（#else 分支）与宿主测试。只做 cmake 配置生成编译数据库，不编译。
  lint-naming:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 clang-tidy
        run: pip install "clang-tidy==${CLANG_TIDY_VERSION}" "pyyaml==6.0.2"

      - name: 安装 Arm GNU 工具链
        uses: ./.github/actions/setup-arm-gcc

      - name: 生成编译数据库
        run: |
          cmake --preset arm-debug
          cmake --preset arm-release
          cmake --preset host-tests

      - name: 命名检查（全量）
        shell: bash
        run: |
          if ! python tool/ci/naming.py --check \
               -p build/arm-debug -p build/arm-release -p build/host-tests; then
            echo "::error::C++ 命名不符合 .clang-tidy。本地生成三个 preset 的编译数据库后执行 python tool/ci/naming.py --fix（clang-tidy ${CLANG_TIDY_VERSION}），模板与注释里的遗漏需手工补齐。"
            exit 1
          fi

  # ---- 架构文本扫描（本仓新增） ----
  # 依赖规则中靠文本检查的部分（docs/ai/architecture.md §4.2）；依赖图检查在 host-tests 与 firmware 作业中。
  lint-arch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 文本扫描（规则 3、8、9、12、15）
        run: python tool/ci/arch_check.py scan

  # ---- Python 测试（模板原样） ----
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检测是否存在 Python 测试
        id: detect
        shell: bash
        run: |
          if find . \( -name 'test_*.py' -o -name '*_test.py' \) \
               -not -path './.git/*' | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "未发现 Python 测试，跳过。"
          fi

      - name: Set up Python
        if: steps.detect.outputs.found == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        if: steps.detect.outputs.found == 'true'
        shell: bash
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest

      - name: Run tests
        if: steps.detect.outputs.found == 'true'
        run: pytest -v

  # ---- 宿主测试（本仓新增） ----
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Ninja
        shell: bash
        run: |
          command -v ninja >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q ninja-build; }
          g++ --version | head -1
          cmake --version | head -1

      - name: 配置
        run: cmake --preset host-tests --graphviz=build/host-tests/graph/targets.dot

      - name: 依赖图检查（宿主）
        run: python3 tool/ci/arch_check.py graph build/host-tests/graph/targets.dot --mode host

      - name: 构建
        run: cmake --build --preset host-tests

      - name: 测试
        run: ctest --preset host-tests

  # ---- 固件构建、符号对照与依赖图检查（本仓新增） ----
  # P1–P2.5 只搬结构、不改行为：根工程的固件与迁移源构建的固件，函数与对象符号的名称、大小、
  # 类型集合必须一致（链接顺序会变，镜像 SHA 不作判据，见评审报告 §7.3）。
  # 迁移源构建保留到 P2：Release 镜像仍须与基线逐字节一致，证明 legacy/ 没有被改动。
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Arm GNU 工具链
        uses: ./.github/actions/setup-arm-gcc

      - name: 构建迁移源（Debug 与 Release）
        shell: bash
        run: |
          src=legacy/Platform/STM32H7/DM_MC02
          for cfg in Debug Release; do
            cmake -S "$src" -B "build/legacy/$cfg" -G Ninja \
              -DCMAKE_BUILD_TYPE="$cfg" \
              -DCMAKE_TOOLCHAIN_FILE="$PWD/$src/cmake/gcc-arm-none-eabi.cmake" \
              -DARM_GCC_ROOT="$ARM_GCC_ROOT"
            cmake --build "build/legacy/$cfg"
          done

      - name: 对照基线（迁移源 Release 逐字节一致）
        shell: bash
        run: |
          cd build/legacy
          grep ' Release/mc02_cpp.bin$' "$GITHUB_WORKSPACE/docs/ai/decisions/baseline-a2cfd16/SHA256SUMS" | sha256sum -c -
          echo "Debug（只供参考，镜像内含工具链安装路径）："
          sha256sum Debug/mc02_cpp.bin

      - name: 构建根工程固件（arm-debug 与 arm-release）
        shell: bash
        run: |
          cmake --preset arm-debug --graphviz=build/arm-debug/graph/targets.dot
          cmake --build --preset arm-debug
          cmake --preset arm-release
          cmake --build --preset arm-release

      - name: 依赖图检查（固件）
        run: python3 tool/ci/arch_check.py graph build/arm-debug/graph/targets.dot --mode firmware

      - name: 符号对照（根工程 vs 迁移源）
        shell: bash
        run: |
          readelf="$ARM_GCC_ROOT/bin/arm-none-eabi-readelf"
          status=0
          for cfg in Debug Release; do
            preset="arm-$(echo "$cfg" | tr '[:upper:]' '[:lower:]')"
            echo "== $cfg"
            python3 tool/ci/symbols.py --readelf "$readelf" compare \
              "build/legacy/$cfg/mc02_cpp.elf" "build/$preset/firmware_baseline.elf" || status=1
            sha256sum "build/$preset/firmware_baseline.bin"
          done
          exit $status

      - name: 上传构建产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/arm-*/firmware_*.elf
            build/arm-*/firmware_*.bin
            build/arm-*/firmware_*.hex
            build/arm-*/firmware_*.map
            build/legacy/*/mc02_cpp.elf
            build/legacy/*/mc02_cpp.bin
            build/legacy/*/mc02_cpp.map
          if-no-files-found: ignore
          retention-days: 14
